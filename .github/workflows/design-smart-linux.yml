name: Gerar Linux Design Smart
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev libfontconfig1-dev libfreetype6-dev libssl-dev libgtk-3-dev libvulkan-dev libgl1-mesa-dev zsync
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Package Linux
        run: bash packaging/linux/package.sh --formats "appimage deb rpm tar"
      - uses: actions/upload-artifact@v4
        with:
          name: Design-Smart-Linux
          path: dist/release/Design-Smart-*-linux-*
          if-no-files-found: error
